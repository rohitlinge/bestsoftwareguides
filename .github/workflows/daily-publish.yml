# Rebuilds and deploys the site every day so scheduled content goes live on its date,
# then pings IndexNow with the pages that went live or changed today.
#
# Pushes to main are deployed by Cloudflare Workers Builds (connected to this repo), so this
# workflow only runs on the daily schedule or by hand (Actions tab -> Daily publish -> Run workflow).
#
# Needs one repository secret: CLOUDFLARE_API_TOKEN
#   Cloudflare -> My Profile -> API Tokens -> Create Token -> template "Edit Cloudflare Workers".
# And one repository variable (Settings -> Secrets and variables -> Actions -> Variables):
#   CLOUDFLARE_ACCOUNT_ID  (Cloudflare dashboard -> Workers & Pages -> Account ID)
name: Daily publish

on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC = 07:00 IST
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check required Cloudflare settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::Missing secret CLOUDFLARE_API_TOKEN (see the comment at the top of this workflow)"; missing=1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::Missing variable CLOUDFLARE_ACCOUNT_ID (see the comment at the top of this workflow)"; missing=1; }
          exit $missing
      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ping IndexNow
        run: node scripts/indexnow.mjs
