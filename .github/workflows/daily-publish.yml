# Rebuilds and deploys the site every day so scheduled content goes live on its date,
# then pings IndexNow with the pages that went live or changed today.
name: Daily publish

on:
  schedule:
    - cron: '30 1 * * *'   # 01:30 UTC = 07:00 IST
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT || 'bestsoftwareguides' }} --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ping IndexNow
        run: node scripts/indexnow.mjs
